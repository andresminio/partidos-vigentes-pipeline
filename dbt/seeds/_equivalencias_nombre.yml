version: 2

seeds:
  - name: equivalencias_nombre
    description: >
      Equivalencias de nombre: cuando un partido figura con nombre_variante (un
      error de escritura conocido), se reemplaza por nombre_canonico. A diferencia
      de correcciones_nombre, se aplica POR NOMBRE en todos los partidos y todos
      los cierres. Se aplica en staging después de la limpieza general (macro
      limpiar_nombre), así que nombre_variante se escribe ya limpio: mayúsculas,
      sin acentos, sin anotaciones *VER y sin espacios alrededor del guion.
    config:
      column_types:
        nombre_variante: string
        nombre_canonico: string
    columns:
      - name: nombre_variante
        description: "Nombre erróneo tal como queda después de la limpieza general."
        data_tests:
          - not_null
          - unique
      - name: nombre_canonico
        description: "Nombre correcto que lo reemplaza."
        data_tests:
          - not_null
