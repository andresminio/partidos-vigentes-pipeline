version: 2

models:
  - name: pub_historizacion
    description: >
      Presentación de la historización para la hoja "Historización" del Sheet.
      Nombres finales, SI/NO, fechas dd-mm-aaaa, "cierre actual" en la vigencia
      abierta y orden de filas (orden_fila). El Apps Script la vuelca tal cual.
  - name: pub_resumen
    description: >
      Presentación del resumen mensual para la hoja "Resumen". snapshot_date como
      fecha_cierre (dd-mm-aaaa); el resto tal cual.
  - name: pub_vigentes
    description: >
      Presentación de la foto actual (partidos vigentes) para la hoja
      "Partidos vigentes". Fechas dd-mm-aaaa; orden por distrito, orden, número.
  - name: pub_cambios_nombre
    description: >
      Presentación de los cambios de nombre para la primera hoja del Sheet
      "Cambios de nombre". Fechas dd-mm-aaaa y orden de filas (orden_fila) en dos
      bloques según el origen del cambio: primero los cambios del nacional (los
      nacionales y los distritos que heredan su cambio, por número de partido, el
      nacional primero), después los cambios distritales propios, integren o no
      (por número de distrito y número de partido). Incluye integra_nacional
      (SI/NO; vacío en los nacionales). El Apps Script la vuelca tal cual.
  - name: pub_auditoria_cambios_nombre
    description: >
      Presentación de la auditoría de cambios de nombre para la segunda hoja del
      Sheet "Cambios de nombre". Una fila por partido y cierre en que cambió el
      nombre crudo o el final. Cierre dd-mm-aaaa y orden de filas (orden_fila):
      primero los nacionales por número de partido, después los distritos por
      número de distrito y número de partido; dentro de cada partido, por cierre.
      El Apps Script la vuelca tal cual.
