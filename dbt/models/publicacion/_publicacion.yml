version: 2

models:
  - name: pub_historizacion
    description: >
      Presentación de la historización para la hoja "Historización" del Sheet.
      Nombres finales, SI/NO, fechas dd-mm-aaaa, "cierre actual" en la vigencia
      abierta y orden de filas (orden_fila). El Apps Script la vuelca tal cual.
  - name: pub_resumen
    description: >
      Presentación del resumen mensual para la hoja "Resumen". snapshot_date como
      fecha_cierre (dd-mm-aaaa); el resto tal cual.
  - name: pub_vigentes
    description: >
      Presentación de la foto actual (partidos vigentes) para la hoja
      "Partidos vigentes". Fechas dd-mm-aaaa; orden por distrito, orden, número.
  - name: pub_cambios_nombre
    description: >
      Presentación de los cambios de nombre para la primera hoja del Sheet
      "Cambios de nombre". Fechas dd-mm-aaaa y orden de filas (orden_fila) en dos
      bloques: primero los nacionales y los distritos que los integran (por número
      de partido, el nacional primero), después los distritos que no integran (por
      distrito y número). Incluye integra_nacional (SI/NO; vacío en los nacionales).
      El Apps Script la vuelca tal cual.
