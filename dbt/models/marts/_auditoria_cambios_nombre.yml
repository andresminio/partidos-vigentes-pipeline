version: 2

models:
  - name: auditoria_cambios_nombre
    description: >
      Auditoría de todos los cambios de nombre, por cualquier motivo. Se construye
      sobre cada cierre (no sobre el SCD2): una fila por partido y cierre en que
      cambió el nombre crudo (tal cual el Excel de origen) o el nombre final
      (después del procesamiento) respecto de la aparición anterior del partido.
      Ordenada por partido_key y cierre (al consultar, ordenar igual: BigQuery no
      garantiza el orden de una tabla).
    columns:
      - name: partido_key
        description: "Clave de la organización partidaria. Ej: D-05-218."
        data_tests:
          - not_null
      - name: orden
        description: "DISTRITO o NACIONAL."
      - name: nro_distrito
        description: "Código de distrito, texto padeado a 2."
      - name: distrito
        description: "Nombre del distrito (canónico)."
      - name: cierre
        description: "Cierre (snapshot) del que proviene la fila."
        data_tests:
          - not_null
      - name: nombre_crudo
        description: "Nombre tal cual vino en el Excel de ese cierre."
      - name: nombre_final
        description: "Nombre después de todo el procesamiento, en ese cierre."
      - name: motivo
        description: >
          Por qué cambió. Si cambió el nombre final: HEREDADO_NACIONAL (viene del
          nacional que integra), CAMBIO_ACEPTADO (homologado en la validación) o
          PENDIENTE (sin decisión). Si el procesamiento absorbió el cambio:
          ERROR_RECHAZADO, EQUIVALENCIA, HEREDADO_NACIONAL o FORMATO_NORMALIZACION
          (normalización y macro limpiar_nombre). SIN_MOTIVO no debería aparecer.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['FORMATO_NORMALIZACION', 'EQUIVALENCIA',
                         'HEREDADO_NACIONAL', 'CAMBIO_ACEPTADO', 'ERROR_RECHAZADO',
                         'PENDIENTE']
