version: 2

seeds:
  - name: homologacion_cambios_nombre
    description: >
      Registro de decisiones de la validación humana de cambios de nombre. Cada
      fila acepta un cambio detectado en int_cambios_nombre, identificado por
      partido_key + fecha_cambio_nombre + nombre_anterior + nombre_nuevo (los
      cuatro deben coincidir exactamente con la detección). Solo se registran
      cambios ACEPTADOS: si un cambio es un error de carga, no se registra acá
      sino que se corrige en el seed correcciones_nombre. Los cambios
      HEREDADO_NACIONAL no se registran: heredan la decisión del cambio del
      partido nacional.
    config:
      column_types:
        partido_key: string
        fecha_cambio_nombre: date
        nombre_anterior: string
        nombre_nuevo: string
        decision: string
        fecha_decision: date
        fundamento: string
        revisado_por: string
    columns:
      - name: partido_key
        description: "Clave del partido cuyo cambio se acepta. Ej: N-01-079."
        data_tests:
          - not_null
      - name: fecha_cambio_nombre
        description: "Fecha de cambio tal como figura en int_cambios_nombre (AAAA-MM-DD)."
        data_tests:
          - not_null
      - name: nombre_anterior
        description: "Nombre anterior, exactamente como figura en int_cambios_nombre."
        data_tests:
          - not_null
      - name: nombre_nuevo
        description: "Nombre nuevo, exactamente como figura en int_cambios_nombre."
        data_tests:
          - not_null
      - name: decision
        description: "Decisión de la validación. Solo ACEPTADO (los rechazos van a correcciones_nombre)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ACEPTADO']
      - name: fecha_decision
        description: "Fecha en que se tomó la decisión (AAAA-MM-DD)."
        data_tests:
          - not_null
      - name: fundamento
        description: "Evidencia que respalda la decisión (resolución, expediente, verificación)."
        data_tests:
          - not_null
      - name: revisado_por
        description: "Quién validó el cambio."
        data_tests:
          - not_null
