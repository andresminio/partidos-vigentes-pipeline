version: 2

models:
  - name: partidos_cambios_nombre
    description: >
      Cambios de nombre por partido. Una fila por cada vez que un partido pasa a
      llamarse distinto (nombre de int_partidos). Se lee: "llevó nombre_anterior
      desde nombre_anterior_desde hasta nombre_anterior_hasta, y a partir de
      fecha_cambio_nombre pasó a llamarse nombre_nuevo". Registra todos los
      cambios, incluidas idas y vueltas. Una ausencia del partido no corta el
      tramo de un nombre. Clave natural: partido_key + fecha_cambio_nombre.
    columns:
      - name: partido_key
        description: "Clave de la organización partidaria. Ej: D-02-154."
        data_tests:
          - not_null
      - name: orden
        description: "Tipo de orden: DISTRITO o NACIONAL."
      - name: nro_distrito
        description: "Código de distrito, texto padeado a 2."
      - name: distrito
        description: "Nombre del distrito (canónico)."
      - name: nro_partido
        description: "Número del partido, texto padeado a 3."
      - name: nombre_anterior
        description: "Nombre que llevaba el partido antes del cambio."
        data_tests:
          - not_null
      - name: nombre_anterior_desde
        description: "Primer cierre en que el partido llevó el nombre anterior (en ese tramo)."
        data_tests:
          - not_null
      - name: nombre_anterior_hasta
        description: "Último cierre en que el partido llevó el nombre anterior."
        data_tests:
          - not_null
      - name: nombre_nuevo
        description: "Nombre que pasa a llevar el partido."
        data_tests:
          - not_null
      - name: fecha_cambio_nombre
        description: >
          Primer cierre con el nombre nuevo. El cambio real ocurrió entre
          nombre_anterior_hasta y esta fecha; la fuente no informa la fecha exacta.
        data_tests:
          - not_null
      - name: distancia_edicion
        description: >
          Cantidad de operaciones de una letra (agregar, quitar o reemplazar) entre
          ambos nombres, comparados sin espacios ni puntuación.
        data_tests:
          - not_null
      - name: tipo_cambio
        description: "ORTOGRAFICO si distancia_edicion <= 2; SUSTANTIVO si es mayor."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ORTOGRAFICO', 'SUSTANTIVO']
      - name: origen_cambio
        description: >
          PROPIO si cambió el nombre propio del partido; HEREDADO_NACIONAL si el
          nombre propio no cambió y el cambio viene de heredar el nombre del
          partido nacional que integra.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PROPIO', 'HEREDADO_NACIONAL']
